[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mixbt"
version = "0.1.0"
description = "Prompt-aware routing of language models with a mixture of Bradley-Terry models (EM, SQUAREM, ECME, L-BFGS)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]

[tool.setuptools]
packages = ["mixbt"]
